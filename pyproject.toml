[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wumpiwave"
version = "0.1.0"
description = "An asynchronous media player library for Discord applications."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["wumpiwave"]

exclude = [
    ".venv",
    "build",
    "dist",
]